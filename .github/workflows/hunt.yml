name: book-hunter

on:
  schedule:
    # כל 3 שעות (UTC). דקה 17 כדי לא להיתקע בעומס של תחילת השעה
    - cron: "17 */6 * * *"
  workflow_dispatch: {}   # כפתור "Run workflow" להרצה ידנית

permissions:
  contents: write   # כדי לשמור את state.json בחזרה במאגר
  issues: write     # כדי לפתוח Issue על כל ממצא חדש

concurrency:
  group: book-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Look for books
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # מובנה, לא צריך להגדיר כלום
          PYTHONUNBUFFERED: "1"        
        run: python hunter.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "book-hunter"
            git config user.email "book-hunter@users.noreply.github.com"
            git add state.json
            git commit -m "update seen copies"
            git push
          fi
